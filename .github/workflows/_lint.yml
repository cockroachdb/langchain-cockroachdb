name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: ./.github/actions/uv_setup
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Pinned so a new linter release cannot break CI on its own.
          # Bump deliberately and fix new findings in the same PR.
          uv pip install --system ruff==0.16.1 mypy==1.19.1

      - name: Run ruff check
        run: |
          ruff check langchain_cockroachdb tests examples

      - name: Run ruff format check
        run: |
          ruff format --check langchain_cockroachdb tests examples

      - name: Run mypy
        run: |
          mypy langchain_cockroachdb --ignore-missing-imports
        continue-on-error: true
