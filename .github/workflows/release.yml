name: Release

on:
 workflow_dispatch:
   inputs:
     version:
       description: Version to release (e.g., 0.1.0)
       required: true
       type: string

jobs:
 release:
   runs-on: ubuntu-latest
   permissions:
     contents: write
     id-token: write

   steps:
     - uses: actions/checkout@v7

     # The release PR carries the version bump and the dated changelog entry,
     # and that entry becomes the GitHub release notes
     - name: Check the version and extract the release notes
       env:
         VERSION: ${{ inputs.version }}
       run: |
         grep -qx "version = \"$VERSION\"" pyproject.toml \
           || { echo "pyproject.toml is not at version $VERSION"; exit 1; }
         grep -qx "__version__ = \"$VERSION\"" langchain_cockroachdb/__init__.py \
           || { echo "langchain_cockroachdb/__init__.py is not at version $VERSION"; exit 1; }
         heading=$(grep -m1 -F "## [$VERSION]" CHANGELOG.md || true)
         [ -n "$heading" ] || { echo "CHANGELOG.md has no entry for $VERSION"; exit 1; }
         case "$heading" in
           *Unreleased*) echo "Date the $VERSION entry in CHANGELOG.md before releasing"; exit 1 ;;
         esac
         extract() {
           awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next}
             found && /^## \[/ {exit} found {print}' "$1" | sed -e '/./,$!d'
         }
         extract CHANGELOG.md > release-notes.md
         grep -q '[^[:space:]]' release-notes.md \
           || { echo "The $VERSION entry in CHANGELOG.md is empty"; exit 1; }
         extract docs/about/changelog.md | cmp -s - release-notes.md \
           || { echo "The $VERSION entry differs between CHANGELOG.md and docs/about/changelog.md"; exit 1; }

     - name: Setup UV
       uses: ./.github/actions/uv_setup
       with:
         python-version: "3.12"

     - name: Install dependencies
       run: |
         uv pip install --system -e ".[dev]"

     - name: Start CockroachDB
       run: |
         docker run -d --name cockroachdb \
           -p 26257:26257 \
           -p 8080:8080 \
           cockroachdb/cockroach:latest \
           start-single-node --insecure

         echo "Waiting for CockroachDB to start..."
         for i in {1..30}; do
           if docker exec cockroachdb ./cockroach sql --insecure -e "SELECT 1" 2>/dev/null; then
             echo "CockroachDB is ready!"
             break
           fi
           echo "Waiting... ($i/30)"
           sleep 2
         done

     - name: Run tests
       env:
         USE_TESTCONTAINER: "false"
         COCKROACHDB_URL: "cockroachdb://root@localhost:26257/defaultdb?sslmode=disable"
       run: |
         pytest tests -v

     - name: Build package
       run: |
         uv build

     - name: Publish to PyPI
       uses: pypa/gh-action-pypi-publish@release/v1
       with:
         skip-existing: true

     - name: Create GitHub Release
       uses: softprops/action-gh-release@v3
       with:
         tag_name: v${{ inputs.version }}
         # Tag the commit this run tested and built, not whatever main points to now
         target_commitish: ${{ github.sha }}
         name: Release v${{ inputs.version }}
         # The changelog entry first, then GitHub's list of merged PRs
         body_path: release-notes.md
         draft: false
         prerelease: false
         generate_release_notes: true
