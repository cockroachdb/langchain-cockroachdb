name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test-python-3-10:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.10"
    secrets: inherit

  test-python-3-11:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.11"
    secrets: inherit

  test-python-3-12:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.12"
      coverage: true
    secrets: inherit

  test-python-3-13:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.13"
    secrets: inherit

  test-python-3-14:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.14"
    secrets: inherit

  test-minimum-dependencies:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.10"
      resolution: "lowest-direct"
    secrets: inherit

  test-minimum-cockroachdb:
    uses: ./.github/workflows/_test.yml
    with:
      python-version: "3.12"
      cockroachdb-version: "v25.4.14"
    secrets: inherit
