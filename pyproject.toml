[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-cockroachdb"
version = "0.5.0"
description = "LangChain integration for CockroachDB with native vector support"
authors = [{name = "Virag Tripathi", email="virag.tripathi@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["langchain", "cockroachdb", "vector", "embeddings", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langgraph-checkpoint>=2.1.2,<5.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<2.1.0",  # sqlalchemy-cockroachdb supports SQLAlchemy 2.0 only, so the cap moves when the dialect supports 2.1
    "sqlalchemy-cockroachdb>=2.0.2,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/cockroachdb/langchain-cockroachdb"
Documentation = "https://cockroachdb.github.io/langchain-cockroachdb/"
Repository = "https://github.com/cockroachdb/langchain-cockroachdb"
Issues = "https://github.com/cockroachdb/langchain-cockroachdb/issues"
Changelog = "https://github.com/cockroachdb/langchain-cockroachdb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "testcontainers>=4.15.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-tests>=1.1.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-conformance>=0.0.2",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
timeout = 600

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLR"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLR0911"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "^.venv/",
    "^build/",
    "^dist/",
]
